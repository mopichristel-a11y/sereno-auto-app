<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — SERENO AUTO SMS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon">🛡️</div>
      <div class="login-title">
        SERENO AUTO
        <span>Management System</span>
      </div>
    </div>

    <div class="login-erreur" id="erreur"></div>

    <form id="form-login">
      <div class="form-group">
        <label class="form-label" for="email">Adresse email</label>
        <input class="form-input" type="email" id="email" placeholder="vous@sereno-auto.cm" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="mot_de_passe">Mot de passe</label>
        <input class="form-input" type="password" id="mot_de_passe" placeholder="••••••••" required>
      </div>
      <button class="btn-primary" type="submit" id="btn-login">Se connecter</button>
    </form>

    <div class="login-footer">
      SERENO AUTO · Yaoundé, Cameroun<br>
      Gestion intelligente de véhicules & contrats CSA
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
// Déjà connecté ? → espace selon le rôle
if (API.tokenValide()) {
  window.location.href = (API.utilisateur && API.utilisateur.role === 'client')
    ? 'client.html' : 'index.html';
}

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn    = document.getElementById('btn-login');
  const erreur = document.getElementById('erreur');
  erreur.classList.remove('visible');
  btn.disabled = true;
  btn.textContent = 'Connexion…';

  try {
    const data = await API.login(
      document.getElementById('email').value.trim(),
      document.getElementById('mot_de_passe').value
    );
    // Routage par rôle : l'équipe va au dashboard, le client à son espace
    window.location.href = data.utilisateur.role === 'client' ? 'client.html' : 'index.html';
  } catch (err) {
    erreur.textContent = err.message || 'Connexion impossible.';
    erreur.classList.add('visible');
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
});
</script>
</body>
</html>
